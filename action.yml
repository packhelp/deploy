name: "Deploy Packhelp app"
description: "Deploy via helm to a Kubernetes cluster. Supports classic helm charts and pre-rendered manifests."
inputs:
  app:
    description: "Application to deploy"
    required: true
  env:
    description: "Environment (staging, production)"
    required: true
  chart_path:
    description: "Custom helm chart directory path"
    default: "helm-chart"
    required: false
  release_version:
    description: "Release version parameter to pass to helm"
    required: false
  extra_params:
    description: "Additional helm parameters"
    required: false
  kubeconfig_pr:
    description: "Kubeconfig for PR cluster"
    required: false
  kubeconfig_np:
    description: "Kubeconfig for NP cluster"
    required: false
  # --- New inputs for pre-rendered mode ---
  mode:
    description: "Deployment mode: 'classic' (default) or 'prerendered'. In prerendered mode, manifests_path must contain ready-to-apply YAML files."
    default: "classic"
    required: false
  manifests_path:
    description: "Path to directory containing pre-rendered K8s manifests (only used in 'prerendered' mode)"
    required: false

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - name: Print inputs
      shell: bash
      run: |
        # Debug input values
        echo "[INFO] app: ${{ inputs.app }}"
        echo "[INFO] env: ${{ inputs.env }}"
        echo "[INFO] mode: ${{ inputs.mode }}"
        echo "[INFO] chart_path: ${{ inputs.chart_path }}"
        echo "[INFO] manifests_path: ${{ inputs.manifests_path }}"
        echo "[INFO] release_version: ${{ inputs.release_version }}"
        echo "[INFO] extra_params: ${{ inputs.extra_params }}"

    - name: Set base helm parameters
      shell: bash
      run: |
        # Setting base helm parameters..
        env="${{ inputs.env }}"
        app="${{ inputs.app }}"
        echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
        echo "ENV=$env" >> $GITHUB_ENV
        echo "CHART_PATH=${{ inputs.chart_path }}" >> $GITHUB_ENV
        echo "HELM_RELEASE=app-$app-$env" >> $GITHUB_ENV
        echo "NAMESPACE=app-$app-$env" >> $GITHUB_ENV
        echo "DEPLOY_MODE=${{ inputs.mode }}" >> $GITHUB_ENV

    - name: Check for envs.yaml file, set up cluster and values file
      if: ${{ env.DEPLOY_MODE == 'classic' }}
      shell: bash
      run: |
        # Checking envs.yaml config and setting up cluster and values file..
        envs_file="envs.yaml"

        # Check if ENV is set
        if [[ -z $ENV ]]; then
          echo "[ERROR] ENV is not set. Please provide ENV input.."
          exit 1
        fi

        if [ -f $CHART_PATH/$envs_file ]; then
          echo "[INFO] File $envs_file exists.."
        else
          echo "[ERROR] File $envs_file does not exist. Please create $envs_file file in $CHART_PATH.."
          echo "[ERROR] Example: https://gist.github.com/awinecki/bdfc59bba671e947bf511122cb8a8a7e"
        fi

        cluster=$(cat $CHART_PATH/$envs_file | yq .$ENV.cluster)
        values_file=$(cat $CHART_PATH/$envs_file | yq .$ENV.values)
        custom_namespace=$(cat $CHART_PATH/$envs_file | yq .$ENV.namespace)

        if [[ $cluster == "null" ]]; then
          echo "[INFO] Env not found in $envs_file. Using default cluster.."
          cluster=$(cat $CHART_PATH/$envs_file | yq .default.cluster)
        fi
        if [[ $custom_namespace != "null" ]]; then
          echo "[INFO] Overriding namespace to $custom_namespace found in $envs_file.."
          echo "NAMESPACE=$custom_namespace" >> $GITHUB_ENV
        fi

        echo "CLUSTER=$cluster" >> $GITHUB_ENV
        echo "VALUES_FILE=$values_file" >> $GITHUB_ENV

    - name: Check for envs.json file, set up cluster and values file
      if: ${{ env.DEPLOY_MODE == 'prerendered' }}
      shell: bash
      run: |

        envs_file="envs.json"
        env_file_path="$CHART_PATH/$envs_file"

        if [ -f $env_file_path ]; then
          echo "[INFO] File $envs_file exists.."
        else
          echo "[ERROR] File $envs_file does not exist. Please create $envs_file file in $CHART_PATH.."
          echo "[ERROR] Example: in lumen repository, it's located in /lumen/helm-chart/envs.json"
          exit 1
        fi

        target_cluster   = $(jq -er '.cluster'   "$env_file_path")
        custom_namespace = $(jq -er '.namespace' "$env_file_path")


        if [[ $target_cluster == "null" ]]; then
          echo "[INFO] Env not found in $envs_file.
          exit 1
        fi
        if [[ $custom_namespace != "null" ]]; then
          echo "[INFO] Overriding namespace to $custom_namespace found in $envs_file.."
          echo "NAMESPACE=$custom_namespace" >> $GITHUB_ENV
        fi

        echo "CLUSTER=$target_cluster" >> $GITHUB_ENV

    - name: Set release version
      shell: bash
      run: |
        # Setting release version. From inputs, or github.sha if not provided..
        release_version="${{ inputs.release_version }}"
        if [[ -z $release_version ]]; then
          release_version="${{ github.sha }}"
        else
          # Slugify release version
          release_version=$(echo $release_version \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9.]+/-/g' \
            | sed -E 's/^-+|-+$//g')
        fi
        echo "[INFO] Setting release version to $release_version.."
        echo "RELEASE_VERSION=$release_version" >> $GITHUB_ENV

    - name: Setup helm
      uses: azure/setup-helm@v4

    - name: Set k8s context to PR
      if: ${{ env.CLUSTER == 'pr' }}
      uses: azure/k8s-set-context@v4
      with:
        method: kubeconfig
        kubeconfig: "${{ inputs.kubeconfig_pr }}"

    - name: Set k8s context to NP
      if: ${{ env.CLUSTER == 'np' }}
      uses: azure/k8s-set-context@v4
      with:
        method: kubeconfig
        kubeconfig: "${{ inputs.kubeconfig_np }}"

    # ============================================================
    # CLASSIC MODE — existing behavior, unchanged
    # ============================================================
    - name: "[classic] Helm lint"
      if: ${{ env.DEPLOY_MODE == 'classic' }}
      shell: bash
      run: |
        # Linting helm chart..
        helm lint --strict \
          ${{ inputs.extra_params }} \
          --set image.tag="$IMAGE_TAG" \
          --set envName="$ENV" \
          --set env="$ENV" \
          --namespace="$NAMESPACE" \
          --values="$CHART_PATH/$VALUES_FILE" \
          $CHART_PATH 1>&2

    - name: "[classic] Helm deploy"
      if: ${{ env.DEPLOY_MODE == 'classic' }}
      shell: bash
      run: |
        # Deploying helm chart..
        helm upgrade $HELM_RELEASE \
          $CHART_PATH \
          ${{ inputs.extra_params }} \
          --values="$CHART_PATH/$VALUES_FILE" \
          --set image.tag="$IMAGE_TAG" \
          --set version="$RELEASE_VERSION" \
          --set envName="$ENV" \
          --set env="$ENV" \
          --timeout "5m0s" \
          --namespace="$NAMESPACE" \
          --install --wait --atomic --create-namespace

    # ============================================================
    # PRERENDERED MODE — caller generates manifests, we wrap in
    # a minimal helm chart and use helm upgrade for release tracking
    # ============================================================
    - name: "[prerendered] Build wrapper chart"
      if: ${{ env.DEPLOY_MODE == 'prerendered' }}
      shell: bash
      run: |
        # Build a minimal helm chart that wraps pre-rendered manifests
        MANIFESTS_PATH="${{ inputs.manifests_path }}"
        WRAPPER_CHART="/tmp/wrapper-chart-$HELM_RELEASE"

        if [[ -z "$MANIFESTS_PATH" ]]; then
          echo "[ERROR] manifests_path is required in prerendered mode"
          exit 1
        fi

        if [[ ! -d "$MANIFESTS_PATH" ]]; then
          echo "[ERROR] manifests_path '$MANIFESTS_PATH' does not exist or is not a directory"
          exit 1
        fi

        # Count yaml files
        YAML_COUNT=$(find "$MANIFESTS_PATH" -name '*.yaml' -o -name '*.yml' | wc -l | tr -d ' ')
        echo "[INFO] Found $YAML_COUNT manifest files in $MANIFESTS_PATH"

        if [[ "$YAML_COUNT" -eq 0 ]]; then
          echo "[ERROR] No YAML files found in $MANIFESTS_PATH"
          exit 1
        fi

        # Create minimal chart structure
        rm -rf "$WRAPPER_CHART"
        mkdir -p "$WRAPPER_CHART/templates"

        cat > "$WRAPPER_CHART/Chart.yaml" <<EOF
        apiVersion: v2
        name: $HELM_RELEASE
        version: 0.1.0
        appVersion: "$RELEASE_VERSION"
        description: "Pre-rendered manifests for $HELM_RELEASE"
        EOF

        # Copy all manifests into templates/ — helm will apply them as-is
        cp "$MANIFESTS_PATH"/*.yaml "$WRAPPER_CHART/templates/" 2>/dev/null || true
        cp "$MANIFESTS_PATH"/*.yml "$WRAPPER_CHART/templates/" 2>/dev/null || true

        echo "[INFO] Wrapper chart created at $WRAPPER_CHART"
        echo "[INFO] Contents:"
        ls -la "$WRAPPER_CHART/templates/"

        echo "WRAPPER_CHART=$WRAPPER_CHART" >> $GITHUB_ENV

    - name: "[prerendered] Helm deploy"
      if: ${{ env.DEPLOY_MODE == 'prerendered' }}
      shell: bash
      run: |
        # Deploying pre-rendered manifests via helm (for release tracking & rollback)
        echo "[INFO] Deploying wrapper chart as helm release: $HELM_RELEASE"
        helm upgrade $HELM_RELEASE \
          "$WRAPPER_CHART" \
          ${{ inputs.extra_params }} \
          --timeout "5m0s" \
          --namespace="$NAMESPACE" \
          --install --wait --atomic --create-namespace

    # ============================================================
    # SHARED — debug on failure
    # ============================================================
    - name: Debug failed deployment
      if: failure()
      shell: bash
      run: |
        # Print logs of a failed deployment's pods and events
        PODS=$(kubectl get pods -n $NAMESPACE -o jsonpath="{.items[*].metadata.name}")
        for POD in $PODS; do
          echo "[DEBUG] Logs for pod $POD:"
          kubectl logs -n $NAMESPACE $POD --timestamps=true --prefix=true --ignore-errors --all-containers
        done

        echo "[DEBUG] Events (Warning) for namespace $NAMESPACE:"
        kubectl events -n $NAMESPACE --types=Warning
